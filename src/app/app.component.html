<div class="row">
  <div class="col-8">
    <div class="card">
      <div class="card-header bg-success">
        <h6>Employee List</h6>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-12">
            <table>
              <thead>
                <tr>
                  <th>Sr No</th>
                  <th>Name</th>
                  <th>Contact No</th>
                  <th>Email Id</th>
                </tr>
              </thead>
              <tbody>
                <!-- Employee data rows will go here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-4">
  <div class="card">
    <div class="card-header bg-success">
      <h5>New Employee</h5>
    </div>
    <div class="card-body">
      <div class="row">
    <div class="row">
    <div class="col-12">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter Name">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="empId" class="form-label">Employee ID</label>
      <input type="text" class="form-control" id="empId" placeholder="Enter Employee ID">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="city" class="form-label">City</label>
      <input type="text" class="form-control" id="city" placeholder="Enter City">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="state" class="form-label">State</label>
      <input type="text" class="form-control" id="state" placeholder="Enter State">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="emailId" class="form-label">Email ID</label>
      <input type="email" class="form-control" id="emailId" placeholder="Enter Email ID">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="contactNumber" class="form-label">Contact Number</label>
      <input type="tel" class="form-control" id="contactNumber" placeholder="Enter Contact Number">
    </div>
  </div>
  <div class="col-6">
    <div class="mb-3">
      <label for="pinCode" class="form-label">Pin Code</label>
      <input type="text" class="form-control" id="pinCode" placeholder="Enter Pin Code">
    </div>
  </div>
   <div class="col-12">
    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <textarea type="text" class="form-control" id="address" placeholder="Enter Address"></textarea>
    </div>
  </div>
  <div class="row">
    <div class="col-6"><button class="btn btn-secondary">Rest</button></div>
    <div class="col-6"><button type="submit" class="btn btn-primary">Add Employee</button></div>
  </div>
</div>

      </div>
    </div>
  </div>
</div>
</div>
